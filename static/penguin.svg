<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Penguin body -->
  <ellipse cx="32" cy="38" rx="18" ry="22" fill="#0099ff" opacity="0.9"/>
  
  <!-- Belly -->
  <ellipse cx="32" cy="40" rx="12" ry="16" fill="#0077cc"/>
  
  <!-- Head -->
  <circle cx="32" cy="18" r="12" fill="#0099ff" opacity="0.9"/>
  
  <!-- Eyes -->
  <circle cx="28" cy="16" r="2.5" fill="#ffffff"/>
  <circle cx="36" cy="16" r="2.5" fill="#ffffff"/>
  <circle cx="28.5" cy="16.5" r="1.2" fill="#000000"/>
  <circle cx="36.5" cy="16.5" r="1.2" fill="#000000"/>
  
  <!-- Beak -->
  <path d="M 32 20 L 29 23 L 35 23 Z" fill="#0088dd"/>
  
  <!-- Wings/Flippers -->
  <ellipse cx="18" cy="36" rx="5" ry="12" fill="#0099ff" opacity="0.8" transform="rotate(-20 18 36)"/>
  <ellipse cx="46" cy="36" rx="5" ry="12" fill="#0099ff" opacity="0.8" transform="rotate(20 46 36)"/>
  
  <!-- Feet -->
  <ellipse cx="26" cy="58" rx="4" ry="3" fill="#0088dd"/>
  <ellipse cx="38" cy="58" rx="4" ry="3" fill="#0088dd"/>
  
  <!-- Glow effect -->
  <circle cx="32" cy="18" r="13" fill="none" stroke="#0099ff" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="32" cy="38" rx="19" ry="23" fill="none" stroke="#0099ff" stroke-width="0.5" opacity="0.3"/>
</svg>
