# =========================
# HTTP (port 80) -> redirect to HTTPS
# =========================
<VirtualHost *:80>
    ServerName egmedia.org
    ServerAlias www.egmedia.org

    # Simple global redirect to HTTPS
    Redirect permanent / https://egmedia.org/

    ErrorLog  ${APACHE_LOG_DIR}/egmedia_http_error.log
    CustomLog ${APACHE_LOG_DIR}/egmedia_http_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =egmedia.org [OR]
    RewriteCond %{SERVER_NAME} =www.egmedia.org
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>


# =========================
# HTTPS (port 443)
# =========================
<VirtualHost *:443>
    ServerName egmedia.org
    ServerAlias www.egmedia.org
    DocumentRoot /var/www/MediaWebsite

    # --- Django via mod_wsgi ---
    WSGIDaemonProcess mediawebsite python-home=/var/www/MediaWebsite/mediasite_env python-path=/var/www/MediaWebsite
    WSGIProcessGroup mediawebsite
    
    # Only route API/admin/accounts paths to Django WSGI
    WSGIScriptAlias /admin /var/www/MediaWebsite/MediaWebsite/wsgi.py
    WSGIScriptAlias /accounts /var/www/MediaWebsite/MediaWebsite/wsgi.py
    WSGIScriptAlias /media /var/www/MediaWebsite/MediaWebsite/wsgi.py
    WSGIScriptAlias /router /var/www/MediaWebsite/MediaWebsite/wsgi.py
    WSGIScriptAlias /data /var/www/MediaWebsite/MediaWebsite/wsgi.py

    <Directory /var/www/MediaWebsite/MediaWebsite>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # --- Turn off directory listings on the project root ---
    <Directory /var/www/MediaWebsite>
        Options -Indexes
        Require all granted
    </Directory>

    # --- Static (served from Django's STATIC_ROOT) ---
    Alias /static/ /var/www/MediaWebsite/static/
    <Directory /var/www/MediaWebsite/static>
        Require all granted
        Options -Indexes
        
        <IfModule mod_headers.c>
            # Default: no cache (for index.html and non-hashed assets)
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            
            # Long cache for hashed assets (match Vite's naming pattern)
            <FilesMatch "\.[0-9a-f]{8}\.(js|css|woff2?|svg|png|jpe?g|gif|webp)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            
            # Also cache common Vite-generated patterns like vendor chunks
            <FilesMatch "^(index|vendor)\.[0-9a-f]{8}\.">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
        </IfModule>
    </Directory>

    # Helpful MIME types for Vite outputs
    AddType application/javascript .mjs
    AddType font/woff2 .woff2
    AddType application/wasm .wasm

    # --- Media or other downloads (unchanged) ---
    Alias /data/ /var/www/MediaWebsite/data/
    <Directory /var/www/MediaWebsite/data>
        Require all granted
        Options -ExecCGI
        # Options +Indexes   # (leave commented to avoid listings)
    </Directory>

    # --- Client-side routing support ---
    # Serve index.html for all non-file/non-API routes
    RewriteEngine On
    
    # If the request is not for an existing file or directory
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    
    # And not for API/admin/static paths
    RewriteCond %{REQUEST_URI} !^/(admin|accounts|media|static|router|data)/
    
    # Then serve the SPA's index.html
    RewriteRule ^ /static/index.html [L]

    # --- Logs ---
    ErrorLog  ${APACHE_LOG_DIR}/egmedia_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/egmedia_ssl_access.log combined

    # --- Security headers ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    # Recommended SPA security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    
    # Only if you're not using external resources/APIs:
    # Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; font-src 'self' data:;"

    # --- SSL ---
    SSLEngine on
    Protocols h2 http/1.1

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/egmedia.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/egmedia.org/privkey.pem
</VirtualHost>